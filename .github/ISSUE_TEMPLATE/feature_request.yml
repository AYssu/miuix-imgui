name: 组件与功能建议
description: 提议组件、交互或接入能力
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与现有方案的限制
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为与验收条件
      description: 涉及 Miuix 时提供具体组件、版本和官方参考。说明状态、交互及平台范围。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案或示例
